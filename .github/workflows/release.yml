name: Release
on:
  workflow_dispatch:
  

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    env: 
      SERVER_VERSION: "3.5.1.${{github.run_number}}"
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
    
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with: 
          dotnet-version: 10

      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Version
        run: sed -i "s|<Version>.*</Version>|<Version>${SERVER_VERSION}</Version>|" "DustyPig.Server/DustyPig.Server.csproj"


      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DustyPig.Server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{github.repository_owner}}/distributedrclone:${{env.SERVER_VERSION}}
            ghcr.io/${{github.repository_owner}}/distributedrclone:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
